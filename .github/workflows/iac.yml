name: iac

on:
  push:
    branches: [main, "feature/**"]
    paths: ["infra/**", ".github/workflows/iac.yml"]
  pull_request:
    paths: ["infra/**", ".github/workflows/iac.yml"]

permissions:
  contents: read

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: terraform fmt
        run: terraform fmt -check -recursive infra

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - name: tflint
        run: |
          cd infra
          tflint --init
          tflint --recursive

  scan:
    name: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          soft_fail_on: LOW,MEDIUM
          output_format: cli
          quiet: true

  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: terraform validate
        run: |
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate

  plan:
    name: plan
    runs-on: ubuntu-latest
    needs: [fmt, lint, scan, validate]
    # OIDC, no long-lived keys. Skipped (not failed) when no AWS role is configured.
    if: ${{ github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != '' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: terraform plan
        run: |
          terraform -chdir=infra init
          terraform -chdir=infra plan -input=false
