---
apiVersion: v1
kind: Secret
metadata:
  name: insighthub-api-keys
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  GEMINI_API_KEY: {{ .Values.api.apiKeys.geminiApiKey | default "" | quote }}
  ANTHROPIC_API_KEY: {{ .Values.api.apiKeys.anthropicApiKey | default "" | quote }}
  VOYAGE_API_KEY: {{ .Values.api.apiKeys.voyageApiKey | default "" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: insighthub-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        {{- if .Values.api.runAsUser }}
        runAsUser: {{ .Values.api.runAsUser }}
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: {{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.passwordSecretName }}
                  key: {{ .Values.db.passwordSecretKey }}
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.db.username }}:$(DB_PASSWORD)@{{ .Values.db.host }}:{{ .Values.db.port }}/{{ .Values.db.name }}"
            {{- range $key, $value := .Values.api.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: insighthub-api-keys
          ports:
            - containerPort: 8000
              name: http
          livenessProbe:
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: 8000
      name: http
      {{- if and (eq .Values.api.service.type "NodePort") .Values.api.service.nodePort }}
      nodePort: {{ .Values.api.service.nodePort }}
      {{- end }}
  type: {{ .Values.api.service.type }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: insighthub-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- if .Values.api.irsa.roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.api.irsa.roleArn | quote }}
  {{- end }}
automountServiceAccountToken: false
