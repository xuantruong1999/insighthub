# Default values for InsightHub Helm chart
# Override with: helm install ... -f values-dev.yaml

db:
  host: postgres
  port: 5432
  name: insighthub
  username: insighthub
  passwordSecretName: postgres-credentials
  passwordSecretKey: POSTGRES_PASSWORD

api:
  replicaCount: 1
  image:
    repository: insighthub-api
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8000

  env:
    REDIS_URL: "redis://redis:6379"
    LLM_PROVIDER: "gemini"
    EMBEDDING_PROVIDER: "gemini"
    EMBEDDING_DIM: "1024"

  apiKeys:
    geminiApiKey: ""
    anthropicApiKey: ""
    voyageApiKey: ""

  irsa:
    roleArn: ""

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  livenessProbe:
    httpGet:
      path: /healthz
      port: 8000
    initialDelaySeconds: 15
    periodSeconds: 10

  readinessProbe:
    httpGet:
      path: /readyz
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 5

worker:
  replicaCount: 1
  image:
    repository: insighthub-worker
    tag: latest
    pullPolicy: IfNotPresent

  env:
    REDIS_URL: "redis://redis:6379"
    LLM_PROVIDER: "gemini"
    EMBEDDING_PROVIDER: "gemini"
    EMBEDDING_DIM: "1024"

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

web:
  replicaCount: 1
  image:
    repository: insighthub-web
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 3000

  env:
    API_INTERNAL_URL: "http://api:8000"

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

postgres:
  enabled: true
  image:
    repository: pgvector/pgvector
    tag: "0.8.2-pg16"
    pullPolicy: IfNotPresent

  persistence:
    enabled: true
    size: 5Gi

  credentials:
    database: insighthub
    username: insighthub
    password: insighthub

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent

  persistence:
    enabled: false

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
